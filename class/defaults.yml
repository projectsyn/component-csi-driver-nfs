parameters:
  csi_driver_nfs:
    =_metadata:
      multi_tenant: true
    namespace: syn-csi-driver-nfs

    charts:
      csi-driver-nfs:
        source: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
        version: 4.13.2

    controller:
      serviceAccountName: csi-nfs-controller-sa

    node:
      serviceAccountName: csi-nfs-node-sa

    helmValues:
      serviceAccount:
        controller: ${csi_driver_nfs:controller:serviceAccountName}
        node: ${csi_driver_nfs:node:serviceAccountName}
